# Dependabot version updates
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # No gomod version updates: the frozen Go oracle corpus byte-pins go.mod
  # (#368) and the Go module is being retired (#373). Security alerts still
  # surface through Dependabot alerts.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # One pull request per week instead of one per action: every workflow
    # change runs the full native matrix, including the scarce macOS runners.
    groups:
      github-actions:
        patterns:
          - "*"
