# Dependabot version updates
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # No gomod version updates: the frozen Go oracle corpus byte-pins go.mod
  # (#368) and the Go module is being retired (#373). Security alerts still
  # surface through Dependabot alerts.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # One pull request per week instead of one per action: every workflow
    # change runs the full native matrix, including the scarce macOS runners.
    groups:
      github-actions:
        patterns:
          - "*"
  # The repository follows the newest stable Rust. rust-toolchain.toml is the
  # single toolchain pin; every workflow installs from it. It is a bound input
  # of the frozen FS/SEC and SQLite evidence, so a toolchain pull request needs
  # the recapture in docs/rust-port/adr-rust-003-candidate-source-scope.md
  # ("Toolchain and dependency updates") before it can merge.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
