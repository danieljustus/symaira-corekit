name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ["1.26.6"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Run tests
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Download dependencies
        run: go mod download
      - name: Verify dependencies
        run: go mod verify
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race -count=1 -timeout=5m ./...
      - name: Test without cgo
        run: CGO_ENABLED=0 go test -count=1 -timeout=5m ./...

  cross-platform:
    name: cross (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1481404843c368bc19ca9406f87d6e0fc97bdcfd # v7.0.0
  #
  #  --- DEPRECATED (replaced by golangci-lint above) ---
  #  go vet / gofmt
  #  gofmt -l .
  #  go vet ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
      - name: Run govulncheck
        run: govulncheck ./...

  apidiff:
    name: apidiff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Fetch base ref
        run: git fetch origin main

      - name: Check for breaking-change escape hatch
        id: hatch
        run: |
          if git log -1 --pretty=%s | grep -q 'BREAKING CHANGE'; then
            echo "Intentional breaking change detected; skipping apidiff."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install apidiff
        if: steps.hatch.outputs.skip != 'true'
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260727155853-b88d891fe743

      - name: Run apidiff against origin/main
        if: steps.hatch.outputs.skip != 'true'
        run: |
          set -euo pipefail
          BASE_DIR=.apidiff-base
          git worktree add "$BASE_DIR" origin/main
          trap 'git worktree remove --force "$BASE_DIR"' EXIT
          # apidiff compares only the exported API; internal and test
          # packages are excluded by default (opt-in via -allow-internal).
          (cd "$BASE_DIR" && apidiff -m -w ../base.api .)
          apidiff -m -incompatible base.api .
