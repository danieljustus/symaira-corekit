  rust-rust013-hardening:
    name: Rust RUST-013 hardening
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Set up Go oracle toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Cache Rust verification tools
        id: rust_tools_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corekit-cargo-install-root
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-rust-1.98.0-nextest-0.9.143-hack-0.6.45-llvm-cov-0.9.0-audit-0.22.2-deny-0.20.2
      - name: Install pinned Rust gate tools on cache miss
        if: steps.rust_tools_cache.outputs.cache-hit != 'true'
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/corekit-cargo-install-root
        shell: bash
        run: |
          cargo install cargo-nextest --version 0.9.143 --locked
          cargo install cargo-hack --version 0.6.45 --locked
          cargo install cargo-llvm-cov --version 0.9.0 --locked
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Add Rust verification tools to PATH
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/corekit-cargo-install-root
        shell: bash
        run: echo "$CARGO_INSTALL_ROOT/bin" >> "$GITHUB_PATH"
      - name: Install pinned Go linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - name: Run complete dual-language hardening gate
        run: make rust-hardening

