name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  changes:
    name: select CI scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      test_matrix: ${{ steps.scope.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Select PR or full coverage
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          full=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            full=false
            git diff --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                rust/*|.cargo/*|port/*|scripts/rust-port/*|testdata/rust-port/*|contracts/*|docs/rust-port/*|.github/workflows/*|Cargo.*|rust-toolchain.toml|Makefile|*.rs)
                  full=true
                  break ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo 'test_matrix=["ubuntu-latest","macos-26"]' >> "$GITHUB_OUTPUT"
  test:
    name: test (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    # matrix.os preserves legacy protected check names; see ADR 0003.
    runs-on: ${{ matrix.os == 'macos-26' && 'macos-15' || matrix.os }}
    steps:
      - name: Record native macOS runner identity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sw_vers
          test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify vendored brand assets
        run: python scripts/verify-brand-assets.py
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --all-features --locked
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Verify pinned Rust tool cache controls
        run: python3 -B -W error -m unittest discover -s scripts/rust-port -p test_rust_ci_tool_cache.py -v
      - name: Verify fail-closed merge gate
        run: python3 -B -W error -m unittest discover -s scripts/rust-port -p test_ci_merge_gate.py -v
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Rust format
        run: cargo fmt --all --check
      - name: Validate Rust migration handoff
        run: make rust-port-validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
  port-contract:
    name: port contract (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    # matrix.os preserves legacy protected check names; see ADR 0003.
    runs-on: ${{ matrix.os == 'macos-26' && 'macos-15' || matrix.os }}
    steps:
      - name: Record native macOS runner identity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sw_vers
          test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate fixture metadata
        run: python docs/rust-port/validate.py
      - name: Verify canonical consumer workspace and adoption controls
        run: |
          python -W error -m unittest discover -s scripts/rust-port -p test_workspace_root.py -v
          python -W error -m unittest discover -s scripts/rust-port -p test_rust005.py -v
      - name: Verify pinned oracle provenance
        run: python scripts/rust-port/generate.py --check-source
      - name: Verify retired Go sources resolve from the v0.18.3 anchor
        run: python -m unittest discover -s scripts/rust-port -p test_retired_go.py -v
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check
  rust-foundation:
    name: Rust foundation (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # matrix.os preserves legacy protected check names; see ADR 0003.
    runs-on: ${{ matrix.os == 'macos-26' && 'macos-15' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - name: Record native macOS runner identity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sw_vers
          test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14" # Darwin waitid(WNOWAIT) for owned process cleanup
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Foundation contract gate
        run: make rust-foundation-contract
      - name: LLM provider contract gate
        run: make rust-llm-contract
      - name: Update contract gate
        run: make rust-update-contract
      - name: Dependency policy (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check
      - name: Retain bounded frozen contract output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-contract-raw-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/frozen-core-replay/
          if-no-files-found: warn
          retention-days: 30
  rust-update-signed:
    name: Rust update signed-release acceptance (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # matrix.os preserves legacy protected check names; see ADR 0003.
    runs-on: ${{ matrix.os == 'macos-26' && 'macos-15' || matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - name: Record native macOS runner identity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sw_vers
          test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14" # Darwin waitid(WNOWAIT) for owned process cleanup
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Install pinned native acceptance tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-nextest --version 0.9.143 --locked
          python -m unittest discover -s scripts/rust-port -p test_cosign_installer.py
          python scripts/rust-port/install-cosign.py --directory "$RUNNER_TEMP/corekit-cosign"
      - name: Verify complete native update acceptance and real signed disposable Apply
        shell: bash
        run: python scripts/rust-port/update-native-acceptance.py --report-dir "$RUNNER_TEMP/corekit-native-update"
      - name: Retain source-bound native update evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-native-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/corekit-native-update
            target/update-apply-native.json
            target/cancellation-native.json
          if-no-files-found: error
          retention-days: 30
  rust-mcp:
    name: Rust MCP (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # matrix.os preserves legacy protected check names; see ADR 0003.
    runs-on: ${{ matrix.os == 'macos-26' && 'macos-15' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - name: Record native macOS runner identity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sw_vers
          test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Install pinned fuzz toolchain
        if: runner.os != 'Windows'
        shell: bash
        run: rustup toolchain install nightly-2026-09-03 --profile minimal
      - name: Rust MCP contract
        run: make rust-mcp-contract
      - name: Rust MCP parser fuzz smoke
        if: runner.os != 'Windows'
        run: |
          cargo install cargo-fuzz --version 0.13.2 --locked
          make mcp-fuzz-smoke
      - name: Python for frozen MCP differential
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run frozen MCP corpus and intended-assertion negative control
        run: make mcp-differential
  rust-mcpcfg:
    name: Rust MCP config (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # matrix.os preserves legacy protected check names; see ADR 0003.
    runs-on: ${{ matrix.os == 'macos-26' && 'macos-15' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - name: Record native macOS runner identity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sw_vers
          test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Rust MCP config contract
        run: make rust-mcpcfg-contract
      - name: Python for frozen MCP config differential
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run MCP config differential corpus
        run: python scripts/rust-port/mcpcfg-differential.py --check
      - name: Verify process-capture integrity, identity and Go-free replay
        run: python -m unittest discover -s scripts/rust-port -p test_frozen_process_oracle.py
  # TEMPORARY (corekit #475): native FS/SEC Go-oracle capture for the one-time
  # re-registration; removed again, with its merge-gate entry, before merge.
  fs-secret-evidence:
    name: TEMPORARY FS/SEC capture (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # matrix.os preserves legacy protected check names; see ADR 0003.
    runs-on: ${{ matrix.os == 'macos-26' && 'macos-15' || matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: macos-26
            target: darwin-arm64
    env:
      FS_NATIVE_TARGET: ${{ matrix.target }}
      # The capture deliberately ignores operator Git configuration.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Record native macOS runner identity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sw_vers
          test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Verify structural controls
        run: python -B -W error -m unittest discover -s scripts/rust-port -p test_fs_secret_oracle.py -v
      - name: Populate pinned oracle dependencies before offline capture
        shell: bash
        run: |
          set -euo pipefail
          # The Go library is retired from main, so ../../.. no longer holds a
          # go.mod: resolve the helper module against the pinned oracle tree.
          oracle=f3d3eb79b9b1f31b4f973d2ed518a8292cedf588
          work="$RUNNER_TEMP/fs-native-bootstrap"
          mkdir -p "$work/src" "$work/helper"
          git archive "$oracle" | tar -x -C "$work/src"
          cp -R scripts/rust-port/go-oracle/. "$work/helper/"
          sed -i.bak "s|^replace github.com/danieljustus/symaira-corekit => .*|replace github.com/danieljustus/symaira-corekit => $work/src|" "$work/helper/go.mod"
          (cd "$work/helper" && go mod download)
      - name: Capture clean native observations without accepting them
        shell: bash
        env:
          GO_ORACLE: '1'
        run: |
          set -euo pipefail
          python scripts/rust-port/fs_secret_oracle.py --capture \
            --output "testdata/rust-port/fixtures/fs-secret/frozen-v1/$FS_NATIVE_TARGET.json" \
            --artifacts-dir "$RUNNER_TEMP/fs-native-evidence/raw"
      - name: Retain original native bytes and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fs-secret-evidence-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            testdata/rust-port/fixtures/fs-secret/frozen-v1/${{ matrix.target }}.json
            ${{ runner.temp }}/fs-native-evidence
          if-no-files-found: error
          retention-days: 30
  rust-sqlite-native:
    name: Rust SQLite native (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # matrix.os preserves legacy protected check names; see ADR 0003.
    runs-on: ${{ matrix.os == 'macos-26' && 'macos-15' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - name: Record native macOS runner identity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sw_vers
          test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      # TEMPORARY (corekit #475): native Go-oracle capture for the one-time
      # re-registration; removed again before merge.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: TEMPORARY native source-bound differential capture
        shell: bash
        run: |
          set -euo pipefail
          source=$(git rev-parse HEAD)
          base='${{ github.event.pull_request.base.sha || github.sha }}'
          git merge-base --is-ancestor "$base" "$source"
          git reset --soft "$base"
          trap 'git reset --soft "$source"' EXIT
          mkdir -p target
          python scripts/rust-port/sqlite/candidate.py --output target/sqlite-native-candidate-source.json
          python scripts/rust-port/sqlite/diff.py --typed-errors --candidate-manifest target/sqlite-native-candidate-source.json --output sqlite-native-report.json
          git reset --soft "$source"
          trap - EXIT
      - name: TEMPORARY retain native differential evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite-native-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            sqlite-native-report.json
            target/sqlite-native-candidate-source.json
          if-no-files-found: error
          retention-days: 30
      - name: SQLite tests and frozen source-bound replay
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p symaira-core-sqlite --all-features --locked
          cargo clippy --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p symaira-core-sqlite --all-targets --all-features --locked -- -D warnings
          # Live Go recapture was retired with the Go library (release/v0.18 only).
          python -m unittest discover -s scripts/rust-port/sqlite -p 'test_*.py'
          python scripts/rust-port/frozen_sqlite_replay.py
  rust-rust003-native:
    name: Rust RUST-003 native (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # matrix.os preserves legacy protected check names; see ADR 0003.
    runs-on: ${{ matrix.os == 'macos-26' && 'macos-15' || matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      FS_REPLAY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Record native macOS runner identity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sw_vers
          test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Populate Rust dependencies before offline replay
        run: cargo fetch --locked
      - name: Run native frozen FS/SEC gate with executable Go and Git denials
        shell: bash
        run: |
          python -B - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, sys, tempfile
          sys.path.insert(0, "scripts/rust-port")
          from bounded_oracle_process import run_checked
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "fs-frozen-native"
          root.mkdir()
          # Use the OS/private TMPDIR, not artifact storage: security tests must
          # not inherit a group-writable volume ancestor from a report path.
          scratch = pathlib.Path(tempfile.mkdtemp(prefix="fs-frozen-native-scratch-"))
          (root / "scratch-path.json").write_text(json.dumps({"owned_scratch": str(scratch)}) + "\n", encoding="utf-8")
          denied = root / "denied-tools"
          denied.mkdir()
          marker = root / "forbidden-tool-called"
          source = denied / "blocked.rs"
          source.write_text('fn main() { std::fs::write(' + json.dumps(marker.as_posix(), ensure_ascii=False) + ', b"invoked").unwrap(); std::process::exit(97); }\n', encoding="utf-8")
          suffix = ".exe" if os.name == "nt" else ""
          binary = denied / ("blocked" + suffix)
          run_checked(["rustc", "--edition=2024", "--crate-name", "blocked_oracle", str(source), "-o", str(binary)], cwd=pathlib.Path.cwd(), env=dict(os.environ), timeout=120, artifact_dir=root / "denial-build", check=True)
          for name in ("go", "git"):
              executable = denied / (name + suffix)
              shutil.copy2(binary, executable)
              probe = run_checked([str(executable), "--version"], cwd=root, env=dict(os.environ), timeout=30, artifact_dir=root / (name + "-denial-control"), check=False)
              assert probe.returncode == 97 and marker.read_bytes() == b"invoked"
              marker.unlink()  # Only the positive control owns this sentinel.
          env = dict(os.environ, PATH=str(denied) + os.pathsep + os.environ["PATH"], CARGO_NET_OFFLINE="true", RUSTUP_AUTO_INSTALL="0", TMPDIR=str(scratch), PYTHONDONTWRITEBYTECODE="1")
          try:
              gate = run_checked(["make", "rust-fs-secret-frozen-contract"], cwd=pathlib.Path.cwd(), env=env, timeout=600, artifact_dir=root / "make-gate", check=True)
          finally:
              for instance in scratch.glob("fs-secret-replay-*"):
                  logs = instance / "logs"
                  if logs.is_dir():
                      shutil.copytree(logs, root / "replay-raw" / instance.name)
          assert not marker.exists(), "frozen acceptance invoked Go or Git"
          summary = json.loads([line for line in gate.stdout.split(b"\n") if line.strip()][-1])
          assert summary["status"] == "PASS" and summary["fs_sec_case_count"] == 13
          assert summary["path_control_count"] == 9 and summary["rust_named_test_passes"] == 1
          assert len(summary["mutations"]) == 2
          logs = pathlib.Path(summary["artifacts_dir"]).resolve()
          assert logs.is_relative_to(scratch.resolve())

          head = os.environ["FS_REPLAY_HEAD"]
          assert re.fullmatch(r"[0-9a-f]{40}", head)
          report = dict(summary, execution_head=head, go_git_denial_controls=True, forbidden_tool_called=False, denial_binary_sha256=hashlib.sha256(binary.read_bytes()).hexdigest())
          (root / "result.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, sort_keys=True))
          shutil.rmtree(scratch)  # Only this invocation owns the private root.
          PY
      - name: Retain frozen replay and executable denial evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fs-frozen-native-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/fs-frozen-native
          if-no-files-found: error
          retention-days: 30
      - name: Audit Rust dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check
  rust-rust003-miri:
    name: Rust RUST-003 Miri
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install pinned nightly and Miri
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add miri --toolchain nightly
      - name: Run Miri with filesystem isolation disabled
        run: MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test -p symaira-core-fs -p symaira-core-secretref --all-features
  rust-rust013-miri:
    name: Rust RUST-013 Miri gate
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install pinned nightly and Miri
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add miri --toolchain nightly
      - name: Validate explicit Miri package partition
        run: python3 scripts/rust-port/miri_gate.py --self-test
      - name: Run negative default-isolation probe
        run: python3 scripts/rust-port/miri_gate.py --negative-test
      - name: Run bounded split Miri gate
        run: python3 scripts/rust-port/miri_gate.py --run
  rust-rust013-native:
    name: Rust RUST-013 native (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # matrix.os preserves legacy protected check names; see ADR 0003.
    runs-on: ${{ matrix.os == 'macos-26' && 'macos-15' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - name: Record native macOS runner identity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sw_vers
          test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Run full workspace tests natively
        run: cargo +1.98.0 test --workspace --all-features --locked
      - name: Run workspace doctests natively
        run: cargo +1.98.0 test --workspace --doc --all-features --locked
  rust-rust013-hardening:
    name: Rust RUST-013 hardening
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Cache Rust verification tools
        id: rust_tools_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corekit-cargo-install-root
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-rust-1.98.0-nextest-0.9.143-hack-0.6.45-llvm-cov-0.9.0-audit-0.22.2-deny-0.20.2
      - name: Install pinned Rust gate tools on cache miss
        if: steps.rust_tools_cache.outputs.cache-hit != 'true'
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/corekit-cargo-install-root
        shell: bash
        run: |
          cargo install cargo-nextest --version 0.9.143 --locked
          cargo install cargo-hack --version 0.6.45 --locked
          cargo install cargo-llvm-cov --version 0.9.0 --locked
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Add Rust verification tools to PATH
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/corekit-cargo-install-root
        shell: bash
        run: echo "$CARGO_INSTALL_ROOT/bin" >> "$GITHUB_PATH"
      - name: Run complete Rust hardening gate
        run: make rust-hardening
  rust-release-manifest:
    name: Rust release manifest
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --version 0.50.0 --locked
      - name: Check Rust API compatibility
        run: cargo semver-checks check-release
      - name: Run non-publishing governance verifier tests
        run: |
          python3 -m unittest discover -s port/release -p 'test_*.py'
          python3 -m unittest discover -s port/consumer -p 'test_*.py'
      - name: Verify release manifest, packages, provenance and SBOM
        run: python3 port/release/verify.py --dry-run
  merge-gate:
    name: merge gate
    # Single fail-closed context over every pull-request CI job; see
    # scripts/rust-port/ci_merge_gate.py for the accepted job results.
    # Manual dispatches are not pull-request evidence and skip the gate.
    if: always() && github.event_name != 'workflow_dispatch'
    needs:
      - changes
      - test
      - lint
      - port-contract
      - audit
      - rust-foundation
      - rust-update-signed
      - rust-mcp
      - rust-mcpcfg
      - rust-sqlite-native
      - fs-secret-evidence # TEMPORARY (corekit #475): remove with the job
      - rust-rust003-native
      - rust-rust003-miri
      - rust-rust013-miri
      - rust-rust013-native
      - rust-rust013-hardening
      - rust-release-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Require every CI job to have passed or been scoped out
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_FULL_SCOPE: ${{ needs.changes.outputs.full }}
        run: python3 -B scripts/rust-port/ci_merge_gate.py
