name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ["1.26.6"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Run tests
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Verify vendored brand assets
        run: python3 scripts/verify-brand-assets.py
      - name: Download dependencies
        run: go mod download
      - name: Verify dependencies
        run: go mod verify
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race -count=1 -timeout=5m ./...
      - name: Test without cgo
        run: CGO_ENABLED=0 go test -count=1 -timeout=5m ./...

  cross-platform:
    name: cross (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      - name: Validate Rust migration handoff
        run: make rust-port-validate

  port-contract:
    name: port contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: go1.26.6
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate fixture metadata
        run: python docs/rust-port/validate.py
      - name: Verify oracle provenance and generated fixtures
        run: python scripts/rust-port/generate.py --check-source && python scripts/rust-port/generate.py --check
      - name: Run native oracle harness self-test
        run: python scripts/rust-port/diff.py --self-test
      - name: Test Go oracle helpers
        working-directory: scripts/rust-port/go-oracle
        run: go test ./...
  #
  #  --- DEPRECATED (replaced by golangci-lint above) ---
  #  go vet / gofmt
  #  gofmt -l .
  #  go vet ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
      - name: Run govulncheck
        run: govulncheck ./...

  apidiff:
    name: apidiff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Fetch base ref
        run: git fetch origin main

      - name: Check for breaking-change escape hatch
        id: hatch
        run: |
          if git log -1 --pretty=%s | grep -q 'BREAKING CHANGE'; then
            echo "Intentional breaking change detected; skipping apidiff."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install apidiff
        if: steps.hatch.outputs.skip != 'true'
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260727155853-b88d891fe743

      - name: Run apidiff against origin/main
        if: steps.hatch.outputs.skip != 'true'
        run: |
          set -euo pipefail
          BASE_DIR=.apidiff-base
          git worktree add "$BASE_DIR" origin/main
          trap 'git worktree remove --force "$BASE_DIR"' EXIT
          # apidiff compares only the exported API; internal and test
          # packages are excluded by default (opt-in via -allow-internal).
          (cd "$BASE_DIR" && apidiff -m -w ../base.api .)
          apidiff -m -incompatible base.api .

  rust-foundation:
    name: Rust foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Set up Go oracle toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Foundation contract gate
        run: make rust-foundation-contract
      - name: Dependency policy (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check

  rust-mcp:
    name: Rust MCP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Install pinned fuzz toolchain
        if: runner.os != 'Windows'
        shell: bash
        run: rustup toolchain install nightly-2026-09-03 --profile minimal
      - name: Rust MCP contract
        run: make rust-mcp-contract
      - name: Rust MCP parser fuzz smoke
        if: runner.os != 'Windows'
        run: |
          cargo install cargo-fuzz --version 0.13.2 --locked
          make mcp-fuzz-smoke
      - name: Go and Rust MCP differential (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Python for MCP differential (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run MCP differential corpus (Linux)
        if: runner.os == 'Linux'
        run: make mcp-differential

  rust-sqlite-native:
    name: Rust SQLite native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: SQLite tests and live source-bound differential
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p symaira-core-sqlite --all-features --locked
          cargo clippy --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p symaira-core-sqlite --all-targets --all-features --locked -- -D warnings
          python -m unittest discover -s scripts/rust-port/sqlite -p 'test_*.py'
          python scripts/rust-port/sqlite/diff.py --typed-errors --output sqlite-native-report.json
      - name: Retain native differential evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sqlite-native-${{ matrix.os }}-${{ github.sha }}
          path: sqlite-native-report.json
          if-no-files-found: error
          retention-days: 30

  rust-rust003-native:
    name: Rust RUST-003 native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Set up Go oracle toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Format and focused native tests
        run: |
          cargo +1.98.0 fmt --all --check
          cargo +1.98.0 test -p symaira-core-fs -p symaira-core-secretref --all-features --locked
      - name: Build and run native differential probe
        shell: bash
        env:
          GOTOOLCHAIN: go1.26.6
          CGO_ENABLED: 0
        run: |
          cargo +1.98.0 build --locked --bin rust-fs-secret
          target="${{ runner.os }}"
          case "$target" in Linux) target=linux ;; macOS) target=darwin ;; Windows) target=windows ;; esac
          corpus="$RUNNER_TEMP/rust003-corpus-${target}.json"
          python scripts/rust-port/generate_fs_secret.py --target "$target" --output "$corpus"
          python scripts/rust-port/validate_fs_secret.py --target "$target" --corpus "$corpus"
          python scripts/rust-port/diff_fs_secret.py
      - name: Audit Rust dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check

  rust-rust003-miri:
    name: Rust RUST-003 Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install pinned nightly and Miri
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add miri --toolchain nightly
      - name: Run Miri with filesystem isolation disabled
        run: MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test -p symaira-core-fs -p symaira-core-secretref --all-features

  rust-rust013-miri:
    name: Rust RUST-013 Miri gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install pinned nightly and Miri
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add miri --toolchain nightly
      - name: Validate explicit Miri package partition
        run: python3 scripts/rust-port/miri_gate.py --self-test
      - name: Run negative default-isolation probe
        run: python3 scripts/rust-port/miri_gate.py --negative-test
      - name: Run bounded split Miri gate
        run: python3 scripts/rust-port/miri_gate.py --run

  rust-rust013-native:
    name: Rust RUST-013 native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Run full workspace tests natively
        run: cargo +1.98.0 test --workspace --all-features --locked
      - name: Run workspace doctests natively
        run: cargo +1.98.0 test --workspace --doc --all-features --locked

  rust-rust013-hardening:
    name: Rust RUST-013 hardening
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Set up Go oracle toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Install pinned Rust gate tools
        run: |
          cargo install cargo-nextest --version 0.9.143 --locked
          cargo install cargo-hack --version 0.6.45 --locked
          cargo install cargo-llvm-cov --version 0.9.0 --locked
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Install pinned Go linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - name: Run complete dual-language hardening gate
        run: make rust-hardening

  rust-release-manifest:
    name: Rust release manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --version 0.50.0 --locked
      - name: Check Rust API compatibility
        run: cargo semver-checks check-release
      - name: Run non-publishing governance verifier tests
        run: |
          python3 -m unittest discover -s port/release -p 'test_*.py'
          python3 -m unittest discover -s port/consumer -p 'test_*.py'
      - name: Verify release manifest, packages, provenance and SBOM
        run: python3 port/release/verify.py --dry-run
