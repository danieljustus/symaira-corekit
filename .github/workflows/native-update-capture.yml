name: Original native update observations

on:
  push:
    branches: [agent/issue368-update-freeze]
    paths:
      - scripts/rust-port/native_update_capture.py
      - .github/workflows/native-update-capture.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-update-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Original update capture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    env:
      GO_ORACLE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Record actual native platform
        shell: bash
        run: |
          uname -a
          if [ "${{ runner.os }}" = macOS ]; then
            sw_vers
            test "$(uname -m)" = arm64
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false
      - name: Populate module cache before isolated capture
        run: go mod download
      - name: Capture original native observations with complete source inventories
        run: python -B scripts/rust-port/native_update_capture.py --output "${{ runner.temp }}/native-update-original"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-update-original-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-update-original
          if-no-files-found: error
          retention-days: 90
