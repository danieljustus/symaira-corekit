# Release automation for the Rust library workspace.
#
# symaira-corekit is a library: it ships no binaries, so there are no release
# assets to build or sign. Rust consumers pin an exact Git revision plus
# Cargo.lock (ADR 0002); crates are not published. Every `v*` tag push creates
# the GitHub Release with generated notes after the Rust test gate on the
# tagged commit passes. The retired Go module's patch releases come only from
# the release/v0.18 branch, whose own workflow keeps the Go gate.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Verify migration notes
        run: |
          tag="${GITHUB_REF_NAME:-}"
          if [ -z "$tag" ]; then
            echo "::error::GITHUB_REF_NAME is empty; cannot verify migration notes"
            exit 1
          fi
          if ! grep -Fqx -- "## $tag" docs/migrations.md; then
            echo "::error::docs/migrations.md has no exact heading for $tag"
            exit 1
          fi
          echo "Found exact migration heading for $tag"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: the coordinated release process may already have
          # created this release (notes assembled from PR bodies). If so,
          # skip — do not fail the workflow with 422 "tag_name already exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping creation."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
