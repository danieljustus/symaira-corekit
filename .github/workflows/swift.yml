# Swift package CI (swift/ sources, manifest at the repository root; ADR 0006).
# Runs on the self-hosted Apple Silicon runner because the package needs a full
# Xcode 26+ toolchain. Fork pull requests never reach the self-hosted runner.
name: Swift

permissions: read-all

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'swift/**'
      - '!swift/**.md'
      - 'contracts/**'
      - '.github/workflows/swift.yml'
  pull_request:
    paths:
      - 'Package.swift'
      - 'swift/**'
      - '!swift/**.md'
      - 'contracts/**'
      - '.github/workflows/swift.yml'
  schedule:
    - cron: '37 5 * * 1'  # weekly Monday 05:37 UTC — full suite incl. tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # /opt/homebrew = Apple Silicon (MacBook runner), /usr/local = legacy Intel path
  PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, macbook-corekit]  # supported self-hosted runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # clean=false: skip Post-Run git cleanup (hangs on self-hosted macOS runners)
          clean: false
      - name: Select supported Xcode
        # CI ignores a stale runner-level selection; direct explicit selections fail closed.
        # Minimum Xcode 26 supplies the required Swift 6.2 compatibility coverage.
        # Select the newest installed full Xcode without changing machine state.
        run: |
          XCODE="$(env -u DEVELOPER_DIR python3 swift/scripts/select_xcode.py --minimum 26.0)"
          echo "DEVELOPER_DIR=$XCODE" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE" xcodebuild -version
      - name: Regression-test Xcode selection
        run: python3 swift/scripts/test_select_xcode.py
      - name: Regression-test stale build description cleanup
        run: python3 swift/scripts/test_drop_stale_build_description.py
      - name: Regression-test formatter discovery
        run: make -C swift test-make
      - name: Self-test the GUI guidelines review
        run: python3 -I swift/scripts/gui-review.py --self-test
      - name: Check Swift formatting
        run: make -C swift lint
      - name: Swift version
        run: swift --version
      - name: Verify approved icon family
        run: python3 swift/scripts/verify-approved-icon.py
      - name: Drop stale Metal toolchain build description
        # The persistent .build keeps the pre-reboot Metal cryptex path (#182).
        run: python3 swift/scripts/drop_stale_build_description.py
      - name: Build
        # Scale parallelism by RAM: Mini (8GB) needs -j2, MacBook (24GB) can do more
        run: |
          MEM_GB=$(($(sysctl -n hw.memsize) / 1073741824))
          if [ "$MEM_GB" -le 8 ]; then JOBS=2; elif [ "$MEM_GB" -le 16 ]; then JOBS=4; else JOBS=6; fi
          # Keep manifest metadata per checkout; the self-hosted runner is shared by worktrees.
          swift build --manifest-cache local -v -j "$JOBS"
      - name: Build tvOS shared libraries
        run: make -C swift build-tvos
      # Runs the full XCTest suite on every push, pull request and the weekly
      # schedule; the schedule catches upstream/toolchain drift (self-hosted
      # runner — faster than queueing on macOS GitHub runners).
      - name: Test
        run: |
          MEM_GB=$(($(sysctl -n hw.memsize) / 1073741824))
          if [ "$MEM_GB" -le 8 ]; then JOBS=2; elif [ "$MEM_GB" -le 16 ]; then JOBS=4; else JOBS=6; fi
          swift test --manifest-cache local -v -j "$JOBS"
      - name: Verify README examples
        run: python3 swift/scripts/check-readme.py

  swift-62-build:
    if: github.event_name != 'pull_request'  # additional Swift 6.2 coverage runs on main and the weekly safety net
    runs-on: [self-hosted, macOS, ARM64, macbook-corekit]  # supported self-hosted runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - name: Select supported Xcode
        # Xcode 26 supplies the Swift 6.2 toolchain covered by this build.
        run: |
          XCODE="$(env -u DEVELOPER_DIR python3 swift/scripts/select_xcode.py --minimum 26.0)"
          echo "DEVELOPER_DIR=$XCODE" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE" xcodebuild -version
      - name: Swift version
        run: swift --version
      - name: Drop stale Metal toolchain build description
        # The persistent .build keeps the pre-reboot Metal cryptex path (#182).
        run: python3 swift/scripts/drop_stale_build_description.py
      - name: Build (Swift 6.2+)
        run: |
          MEM_GB=$(($(sysctl -n hw.memsize) / 1073741824))
          if [ "$MEM_GB" -le 8 ]; then JOBS=2; elif [ "$MEM_GB" -le 16 ]; then JOBS=4; else JOBS=6; fi
          swift build --manifest-cache local -v -j "$JOBS"

  # The self-hosted jobs select the newest installed Xcode (27.x on the MacBook
  # runner) and build Debug. Consumers archive Release (whole-module) with
  # Xcode 26.6 on the hosted macos-26 image, where #486 failed to compile while
  # every job here stayed green. This job builds every product in Release with
  # that image's default Xcode so such a diagnostic fails before a tag (#487).
  release-build-xcode-26:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Xcode 26 toolchain
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | sed -n '1p')"
          echo "$XCODE_VERSION"
          swift --version
          case "$XCODE_VERSION" in
            Xcode\ 26.*) ;;
            *) echo "::error::Expected the hosted image's Xcode 26.x, got: $XCODE_VERSION"; exit 1 ;;
          esac
      - name: Build (Release, whole-module)
        run: swift build -c release

  # Regression test for #44: ba4bbb2 removed the iOS platform declaration from
  # Package.swift and the break was invisible because the CI only built for
  # macOS. Builds the package against the iOS Simulator SDK in parallel with
  # the macOS jobs (`swift build --sdk` needs no code signing), then runs the
  # SymairaTheme tests on an existing iOS Simulator device.
  ios-build:
    if: github.event_name != 'pull_request'  # full iOS compatibility coverage runs on main and the weekly safety net
    runs-on: [self-hosted, macOS, ARM64, macbook-corekit]  # supported self-hosted runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # clean=false: skip Post-Run git cleanup (hangs on self-hosted macOS runners)
          clean: false
      - name: Select supported Xcode
        # Ignore any stale runner-level selection; direct explicit selections fail closed.
        run: |
          XCODE="$(env -u DEVELOPER_DIR python3 swift/scripts/select_xcode.py --minimum 26.0)"
          echo "DEVELOPER_DIR=$XCODE" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE" xcodebuild -version
      - name: Swift version
        run: swift --version
      - name: iOS platform declared
        # swift build --triple <ios-simulator> still succeeds when Package.swift
        # lacks platforms: [.iOS(...)] (SPM falls back to the SDK default
        # deployment target), so assert the resolved manifest explicitly to keep
        # this job red if the declaration is removed again (#44 regression).
        run: |
          PLATFORMS="$(swift package --manifest-cache local dump-package)"
          if ! grep -q '"platformName"[[:space:]]*:[[:space:]]*"ios"' <<<"$PLATFORMS"; then
            echo "::error::Package.swift does not declare iOS support; add platforms: [.iOS(.v17)] back." >&2
            exit 1
          fi
      - name: Drop stale Metal toolchain build description
        # The persistent .build keeps the pre-reboot Metal cryptex path (#182).
        run: python3 swift/scripts/drop_stale_build_description.py
      - name: Build (iOS Simulator)
        # Scale parallelism by RAM: Mini (8GB) needs -j2, MacBook (24GB) can do more
        run: |
          MEM_GB=$(($(sysctl -n hw.memsize) / 1073741824))
          if [ "$MEM_GB" -le 8 ]; then JOBS=2; elif [ "$MEM_GB" -le 16 ]; then JOBS=4; else JOBS=6; fi
          swift build --manifest-cache local --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" --triple arm64-apple-ios17.0-simulator -j "$JOBS"
      - name: Regression-test iOS Simulator selection
        run: python3 swift/scripts/test_select_ios_simulator.py
      - name: Test SymairaTheme (iOS Simulator)
        # Executes the UIKit surface tests (TopoMetalUIKitTests and friends) on
        # an iOS Simulator (#479). The script picks an existing device on the
        # runner host and fails instead of creating one.
        run: |
          UDID="$(python3 swift/scripts/select_ios_simulator.py)"
          xcodebuild test -scheme symaira-corekit-Package -destination "id=$UDID" \
            -only-testing:SymairaThemeTests -derivedDataPath .build/xcode-ios-simulator
