[workspace]
members = [
  "rust/symaira-core-exit",
  "rust/symaira-core-version",
  "rust/symaira-core-env",
  "rust/symaira-core-log",
  "rust/symaira-core-config",
  "rust/symaira-core-mcp",
  "rust/symaira-core-fs",
  "rust/symaira-core-secretref",
  "rust/test-support/symaira-contract-fixtures",
  "rust/test-support/symaira-core-foundation",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/danieljustus/symaira-corekit"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
schemars = { version = "=1.2.2", features = ["derive"] }
serde_ignored = "=0.1.14"
thiserror = "=2.0.17"
toml = "=1.1.5"
tracing = "=0.1.41"
