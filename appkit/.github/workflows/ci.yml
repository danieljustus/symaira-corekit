name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    - cron: '37 5 * * 1'  # weekly Monday 05:37 UTC — full suite incl. tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # /opt/homebrew = Apple Silicon (macbook runner), /usr/local = Intel (mac-mini runner)
  PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

jobs:
  test:
    runs-on: [self-hosted, macOS, X64, mac-mini]  # Mac Mini runner (GitHub macOS queue is the bottleneck)
    steps:
      - uses: actions/checkout@v7
        with:
          # clean=false: skip Post-Run git cleanup (hangs on self-hosted macOS runners)
          clean: false
      - name: Select Xcode
        # CLT lacks XCTest; DEVELOPER_DIR points swift at the full Xcode toolchain
        # without needing sudo (macbook runner has no passwordless sudo).
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then XCODE=/Applications/Xcode_16.4.app; else XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"; fi
          sudo -n xcode-select -s "$XCODE" 2>/dev/null || true
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
      - name: Swift version
        run: swift --version
      - name: Build
        # Scale parallelism by RAM: Mini (8GB) needs -j2, MacBook (24GB) can do more
        run: |
          MEM_GB=$(($(sysctl -n hw.memsize) / 1073741824))
          if [ "$MEM_GB" -le 8 ]; then JOBS=2; elif [ "$MEM_GB" -le 16 ]; then JOBS=4; else JOBS=6; fi
          swift build -v -j "$JOBS"
      # PR gate is build-only; the XCTest suite runs on main pushes and the
      # weekly schedule (macOS GitHub runners queue badly — local runs are faster).
      - name: Test
        run: |
          MEM_GB=$(($(sysctl -n hw.memsize) / 1073741824))
          if [ "$MEM_GB" -le 8 ]; then JOBS=2; elif [ "$MEM_GB" -le 16 ]; then JOBS=4; else JOBS=6; fi
          swift test -v -j "$JOBS"

  ios-build:
    runs-on: [self-hosted, macOS, X64, mac-mini]
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then XCODE=/Applications/Xcode_16.4.app; else XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"; fi
          sudo -n xcode-select -s "$XCODE" 2>/dev/null || true
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
      - name: Check iOS SDK availability
        id: ios-sdk
        run: |
          if xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "iOS SDK not available on this runner — skipping iOS build"
          fi
      - name: Build (iOS)
        if: steps.ios-sdk.outputs.available == 'true'
        run: |
          swift build --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -Xswiftc -target -Xswiftc arm64-apple-ios17.0

  swift-62-build:
    runs-on: [self-hosted, macOS, X64, mac-mini]
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - name: Select Xcode (prefer 26+ for Swift 6.2)
        run: |
          XCODE26=$(ls -d /Applications/Xcode-26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE26" ]; then
            echo "DEVELOPER_DIR=$XCODE26/Contents/Developer" >> "$GITHUB_ENV"
          else
            XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
            echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
            echo "Xcode 26 not found — using $XCODE (Swift 6.2 branches may not compile)"
          fi
      - name: Swift version
        run: swift --version
      - name: Build (Swift 6.2+)
        run: |
          MEM_GB=$(($(sysctl -n hw.memsize) / 1073741824))
          if [ "$MEM_GB" -le 8 ]; then JOBS=2; elif [ "$MEM_GB" -le 16 ]; then JOBS=4; else JOBS=6; fi
          swift build -v -j "$JOBS"
