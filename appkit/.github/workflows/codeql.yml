name: CodeQL

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-actions:
    name: Analyze (GitHub Actions)
    runs-on: [self-hosted, macOS, ARM64, macbook-appkit]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  analyze-swift:
    name: Analyze (Swift)
    runs-on: [self-hosted, macOS, ARM64, macbook-appkit]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 27
        # Same selection as CI: the newest installed full Xcode, no hard-coded
        # path. A fixed Xcode-beta.app path failed every run once the beta was
        # replaced by the release.
        run: |
          XCODE="$(env -u DEVELOPER_DIR python3 scripts/select_xcode.py --minimum 27.0)"
          echo "DEVELOPER_DIR=$XCODE" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE" xcodebuild -version
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
      - name: Build Swift package
        # A fresh scratch path forces a full compile so CodeQL can trace every
        # source; the persistent .build on this runner would be a no-op build.
        # --disable-sandbox: under the CodeQL tracer SwiftPM cannot spawn
        # /usr/bin/sandbox-exec (arm64e system binary; "Bad CPU type in
        # executable") on macOS 27.
        run: swift build --disable-sandbox --manifest-cache local --scratch-path "$RUNNER_TEMP/codeql-build"
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
