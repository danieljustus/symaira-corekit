<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Symaira Kit · Demo</title>
<link rel="stylesheet" href="../dist/tokens.css">
<style>
*{box-sizing:border-box;margin:0}
body{font:500 13.5px/1.5 var(--sym-font);-webkit-font-smoothing:antialiased;background:var(--sym-canvas);color:var(--sym-ink);min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.bar{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--sym-line);position:relative;z-index:2;background:var(--sym-sidebar)}
.app{position:relative;display:grid;place-items:center;padding:48px 24px;overflow:hidden}
.btn{font:600 12.5px/1.4 var(--sym-font);padding:7px 15px;border-radius:var(--sym-radius-md);border:1px solid var(--sym-line);background:var(--sym-surface);color:var(--sym-ink);cursor:pointer}
.btn[aria-pressed="true"],.primary{background:var(--sym-primary);color:var(--sym-on-primary);border-color:transparent}
.btn:focus-visible{outline:2px solid var(--sym-primary);outline-offset:2px}
.card{position:relative;z-index:1;width:min(560px,100%);background:var(--sym-surface);border:1px solid var(--sym-line);border-radius:var(--sym-radius-lg);padding:20px 22px;display:grid;gap:10px}
.card h1{font:700 16px/1.3 var(--sym-font);letter-spacing:-.01em}
.card p{color:var(--sym-ink-2)}
.status{display:inline-flex;gap:8px;align-items:center;font:600 12px/1 var(--sym-font);color:var(--sym-ink-2)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--sym-primary)}
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Zustand">
  <button class="btn" data-s="idle">Bereit</button>
  <button class="btn" data-s="thinking">Denkt nach</button>
  <button class="btn" data-s="problem">Problem</button>
  <button class="btn" data-s="input">Wartet auf dich</button>
  <span style="flex:1"></span>
  <button class="btn" id="theme">Hell / Dunkel</button>
</div>
<main class="app" id="app">
  <section class="card" data-topo="hill">
    <span class="status" data-topo-status role="status"><i></i><span id="label">Bereit</span></span>
    <h1>Symaira Liquid Topography</h1>
    <p>Diese Seite nutzt ausschließlich <code>dist/tokens.css</code>, <code>topo.json</code> und <code>web/symaira-topo.js</code> aus dem Kit.</p>
    <div><button class="btn primary" id="ask">Antwort geben</button></div>
  </section>
</main>
<script type="module">
import { mountTopo } from "./symaira-topo.js";
const params = await (await fetch("../topo.json")).json();
const q = new URLSearchParams(location.search);
if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme");
const topo = mountTopo(document.getElementById("app"), { params });
const labels = { idle: "Bereit", thinking: "Denkt nach", problem: "Problem", input: "Wartet auf dich" };
function set(s) {
  topo.setState(s, s === "input" ? document.getElementById("ask") : undefined);
  document.getElementById("label").textContent = labels[s];
  document.querySelectorAll("[data-s]").forEach(b => b.setAttribute("aria-pressed", b.dataset.s === s));
}
document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => set(b.dataset.s));
document.getElementById("theme").onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; };
set(q.get("s") || "idle");
window.__topoOK = topo.supported;
</script>
</body>
</html>
