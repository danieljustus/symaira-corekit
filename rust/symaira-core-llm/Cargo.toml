[package]
name = "symaira-core-llm"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
symaira-core-exit = { path = "../symaira-core-exit", version = "=0.0.0" }
symaira-core-secretref = { path = "../symaira-core-secretref", version = "=0.0.0" }
ureq.workspace = true
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "system-proxy"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }

[dev-dependencies]
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
